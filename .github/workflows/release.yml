name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Build and test
      run: |
        ./gradlew build
        ./gradlew test
    
    - name: Create distribution
      run: ./gradlew installDist
    
    - name: Create release tarball
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        tar -czf kpm-$VERSION.tar.gz -C build/install kpm/
        echo "VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Calculate SHA256
      run: |
        SHA256=$(shasum -a 256 kpm-$VERSION.tar.gz | cut -d' ' -f1)
        echo "SHA256=$SHA256" >> $GITHUB_ENV
        echo "SHA256: $SHA256"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: kpm-${{ env.VERSION }}.tar.gz
        generate_release_notes: true
        body: |
          ## Installation
          
          ### Homebrew (macOS/Linux)
          ```bash
          brew install BenMorrisRains/kpm/kpm
          ```
          
          ### Manual Installation
          ```bash
          curl -L https://github.com/BenMorrisRains/Kotlin-Package-Manager/releases/download/v${{ env.VERSION }}/kpm-${{ env.VERSION }}.tar.gz | tar xz
          export PATH="$PWD/kpm/bin:$PATH"
          ```
          
          ## SHA256
          ```
          ${{ env.SHA256 }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Output Homebrew Information
      run: |
        echo " Homebrew Formula Update Required"
        echo "Repository: https://github.com/BenMorrisRains/homebrew-kpm"
        echo "Update kpm.rb with:"
        echo "  Version: v$VERSION"
        echo "  SHA256: $SHA256"
        echo ""
        echo "Or use the update script:"
        echo "./scripts/update-homebrew-formula.sh $VERSION $SHA256"
